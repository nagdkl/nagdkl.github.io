  recovery_source_path_overlap: 0
  hse_index_blob_unchanged: 2606d236549a1a43e9e5ba3684b888d784f18fe0
  hse_layout_blob_unchanged: 0b4de0aa8242c2d533d86ba50d59b7a63dd8a097
  decision: rebind_exact_base_only
